<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>划词智能翻译</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 300px;
        min-height: 0;
      }
      .pop {
        padding: 18px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .head > div {
        min-width: 0;
      }
      .head h1 {
        font-size: 15px;
      }
      #cfgStatus {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.5;
      }
      #cfgStatus::before {
        content: '';
        flex: none;
        width: 7px;
        height: 7px;
        margin-top: 5px;
        border-radius: 50%;
        background: var(--pri);
        box-shadow: 0 0 0 3px var(--pri-soft-2);
      }
      #cfgStatus.err {
        color: var(--warn);
      }
      #cfgStatus.err::before {
        background: var(--warn);
        box-shadow: 0 0 0 3px var(--warn-soft);
      }
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 10px;
        padding: 14px 14px 14px 16px;
        border: 1px solid var(--outline);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      .toggle-text {
        flex: 1;
        min-width: 0;
      }
      .toggle-text strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }
      .toggle-text small {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 400;
        color: var(--text2);
      }
      .switch {
        position: relative;
        flex: none;
        width: 44px;
        height: 26px;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        border-radius: 13px;
        background: var(--outline-strong);
        transition: background 0.2s, box-shadow 0.2s;
      }
      .slider::before {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgba(10, 30, 70, 0.3);
        transition: transform 0.22s cubic-bezier(0.3, 0.7, 0.4, 1.3);
      }
      .switch input:checked + .slider {
        background: var(--grad);
      }
      .switch input:checked + .slider::before {
        transform: translateX(18px);
      }
      .switch input:focus-visible + .slider {
        box-shadow: 0 0 0 4px var(--focus);
      }
      .full {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="pop">
      <div class="head">
        <div class="brand" aria-hidden="true">译</div>
        <div>
          <h1>划词智能翻译</h1>
          <p class="subtitle" id="cfgStatus">…</p>
        </div>
      </div>
      <label class="toggle-row" for="enabled">
        <span class="toggle-text">
          <strong>启用划词翻译</strong>
          <small>选中文字后显示「译」按钮</small>
        </span>
        <span class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></span>
      </label>
      <div id="translateSection" class="translate-section">
        <textarea id="translateInput" rows="3" spellcheck="false" placeholder="在此输入或粘贴中文"></textarea>
        <div class="row translate-row">
          <select id="translateTarget">
            <option value="English">英语</option>
            <option value="Japanese">日语</option>
          </select>
          <button id="translateBtn" class="btn btn-tonal full" type="button">翻译</button>
        </div>
        <div id="translateResult" class="translate-result" role="status" aria-live="polite" hidden>
          <div id="translateStatus" class="status"></div>
          <div id="translateText" class="translate-text"></div>
          <button id="translateCopy" type="button" class="translate-copy" hidden>复制</button>
        </div>
      </div>
      <button id="openOptions" class="btn btn-tonal full" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        打开设置
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
